[project]
name = "deallens"
version = "0.3.0"
description = "Acquisition intelligence for evidence-backed investment committee diligence memos."
requires-python = ">=3.11"
dependencies = [
    "tavily-python>=0.7.12",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "langsmith>=0.4",
    "langchain>=1.0",
    "langchain-nebius>=0.1.0",
    "openai>=1.0",
    "fastapi>=0.116",
    "uvicorn>=0.35",
    "reportlab>=4.2",
]

[project.scripts]
deallens = "deallens.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deallens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

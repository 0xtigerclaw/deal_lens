name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --dev
      - name: Unit and API tests
        run: uv run pytest
      - name: Deterministic safety evals
        run: uv run deallens eval --json-out reports/evals/ci-run.json
      - name: Preserve evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deallens-evaluation-report
          path: reports/evals/ci-run.json
          if-no-files-found: error
